spring:
  application:
    name: maintenex-api
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/maintenex}
    username: ${DATABASE_USER:maintenex}
    password: ${DATABASE_PASSWORD:maintenex}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

maintenex:
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
  site-url: ${SITE_URL:http://localhost:5173}
  supabase:
    url: ${SUPABASE_URL:}
    publishable-key: ${SUPABASE_PUBLISHABLE_KEY:}
