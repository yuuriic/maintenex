services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: maintenex
      POSTGRES_USER: maintenex
      POSTGRES_PASSWORD: maintenex
    ports:
      - "5432:5432"
    volumes:
      - maintenex_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maintenex -d maintenex"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  maintenex_postgres:
