<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0b" />

    <!-- Evita flash de tema errado: a landing pública ("/") é sempre clara,
         independente da preferência salva do painel logado. -->
    <script>
      (function () {
        var claro = location.pathname === '/'
          || (localStorage.getItem('maintenex.tema') || (matchMedia('(prefers-color-scheme: light)').matches ? 'claro' : 'escuro')) === 'claro'
        document.documentElement.dataset.tema = claro ? 'claro' : 'escuro'
      })()
    </script>

    <title>Maintenex — Software de gestão de manutenção (checklists, estoque e pendências)</title>
    <meta
      name="description"
      content="Maintenex é o sistema de gestão de manutenção que reúne checklists preventivos, controle de estoque de peças e pendências com SLA em um painel único. Multiempresa, com acesso por papéis."
    />

      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700;800&display=swap"

            "url": "https://www.maintenex.com.br/",
            "description": "Sistema de gestão de manutenção com checklists preventivos, controle de estoque de peças e acompanhamento de pendências com SLA.",
